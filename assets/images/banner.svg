<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D12"/>
      <stop offset="50%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Crimson Accent Gradients -->
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B91C1C" stop-opacity="0.4"/>
    </linearGradient>

    <linearGradient id="textCrimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262D" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="40" cy="40" r="1.5" fill="#30363D"/>
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Card Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Outer Border with Crimson Glow -->
  <rect width="1198" height="358" x="1" y="1" rx="15" fill="none" stroke="#30363D" stroke-width="1.5"/>
  <rect width="1198" height="3" x="1" y="1" fill="url(#crimsonGlow)"/>

  <!-- Architectural Engineering Vector Geometry (Right Side) -->
  <g opacity="0.35">
    <path d="M750 360 L900 180 L1150 360 Z" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6,6"/>
    <path d="M820 0 L1020 220 L1200 20 Z" fill="none" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="980" cy="150" r="120" fill="none" stroke="#30363D" stroke-width="1"/>
    <circle cx="980" cy="150" r="80" fill="none" stroke="#DC2626" stroke-width="1" stroke-dasharray="3,6"/>
    <circle cx="980" cy="150" r="8" fill="#EF4444"/>
    
    <!-- Isometric Cube Frame -->
    <g transform="translate(1020, 80) scale(0.7)">
      <path d="M 0,-50 L 43,-25 L 43,25 L 0,50 L -43,25 L -43,-25 Z" fill="none" stroke="#EF4444" stroke-width="2"/>
      <path d="M 0,-50 L 0,50 M 0,0 L 43,-25 M 0,0 L -43,-25" fill="none" stroke="#EF4444" stroke-width="1.5"/>
    </g>
    <g transform="translate(880, 240) scale(0.5)">
      <path d="M 0,-50 L 43,-25 L 43,25 L 0,50 L -43,25 L -43,-25 Z" fill="none" stroke="#DC2626" stroke-width="2"/>
      <path d="M 0,-50 L 0,50 M 0,0 L 43,-25 M 0,0 L -43,-25" fill="none" stroke="#DC2626" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Left Accent Line -->
  <rect x="60" y="65" width="6" height="230" rx="3" fill="url(#crimsonGlow)" filter="url(#glow)"/>

  <!-- Main Typography & Header -->
  <g transform="translate(90, 0)">
    <!-- Subtitle Badge -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="270" height="28" rx="14" fill="#161B22" stroke="#DC2626" stroke-width="1"/>
      <circle cx="16" cy="14" r="5" fill="#EF4444"/>
      <text x="30" y="18" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="700" fill="#F0F6FC" letter-spacing="1.5">FULLSTACK DEVELOPER</text>
    </g>

    <!-- Main Title: PREETHIKA C -->
    <text x="0" y="155" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="54" font-weight="900" fill="#F0F6FC" letter-spacing="2">
      PREETHIKA C
    </text>

    <!-- Engineering Philosophy Tagline -->
    <text x="0" y="195" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="17" font-weight="400" fill="#8B949E">
      Architecting <tspan fill="#EF4444" font-weight="600">High-Performance Web Systems</tspan> &amp; <tspan fill="#F0F6FC" font-weight="600">Interactive User Experiences</tspan>
    </text>

    <!-- Core Tech Pill Badges -->
    <g transform="translate(0, 230)">
      <!-- React -->
      <g transform="translate(0,0)">
        <rect x="0" y="0" width="95" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="47" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#61DAFB" text-anchor="middle">React.js</text>
      </g>
      <!-- Python/Django -->
      <g transform="translate(107,0)">
        <rect x="0" y="0" width="125" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="62" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#44B78B" text-anchor="middle">Python / Django</text>
      </g>
      <!-- JavaScript -->
      <g transform="translate(244,0)">
        <rect x="0" y="0" width="120" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="60" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F7DF1E" text-anchor="middle">JavaScript ES6+</text>
      </g>
      <!-- Bootstrap / CSS3 -->
      <g transform="translate(376,0)">
        <rect x="0" y="0" width="105" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="52" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7952B3" text-anchor="middle">Bootstrap 5</text>
      </g>
      <!-- MySQL -->
      <g transform="translate(493,0)">
        <rect x="0" y="0" width="85" height="32" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
        <text x="42" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#00758F" text-anchor="middle">MySQL</text>
      </g>
      <!-- FullStack Web Arch -->
      <g transform="translate(590,0)">
        <rect x="0" y="0" width="180" height="32" rx="6" fill="#211215" stroke="#DC2626" stroke-width="1"/>
        <text x="90" y="21" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">⚡ FullStack Architecture</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Bar -->
  <rect x="60" y="315" width="1080" height="1" fill="#21262D"/>
  <rect x="60" y="315" width="220" height="2" fill="url(#crimsonGlow)"/>
</svg>
